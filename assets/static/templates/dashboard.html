<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>glances-rs</title>
<style>
  :root { --bg: #0a0c10; --fg: #c9d1d9; --bright: #f0f3f6; --dim: #7d8590;
          --line: #21262d; --green: #3fb950; --cyan: #39c5cf; --orange: #d29922;
          --red: #f85149; --accent: #ce422b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header.top { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
         padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header.top .logo { color: var(--bright); font-weight: 700; font-size: 15px; }
  header.top .logo span { color: var(--accent); }
  header.top .host { color: var(--bright); }
  header.top .sub { color: var(--dim); font-size: 12px; }
  header.top .right { margin-left: auto; display: flex; gap: 16px; color: var(--dim); }
  header.top .right b { color: var(--bright); font-weight: 600; }
  main { display: grid; gap: 0 16px; padding: 8px 12px 24px;
         grid-template-columns: 300px 300px minmax(420px, 1fr); align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  section { margin-bottom: 10px; }
  section h2 { margin: 0 0 4px; font-size: 12px; font-weight: 700;
         text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
         border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
  .row .k { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v { color: var(--bright); white-space: nowrap; }
  .bar { height: 10px; background: var(--line); border-radius: 2px; margin: 3px 0 5px; }
  .bar > div { height: 100%; border-radius: 2px; background: var(--green); }
  .bar.warm > div { background: var(--orange); }
  .bar.hot > div { background: var(--red); }
  .mini { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .mini .k { width: 52px; color: var(--dim); flex: none; }
  .mini .bar { flex: 1; margin: 0; height: 8px; }
  .mini .v { width: 52px; text-align: right; color: var(--bright); flex: none; }
  .ok { color: var(--green); } .warm-t { color: var(--orange); } .hot-t { color: var(--red); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 1px 10px 1px 0; white-space: nowrap; }
  th { color: var(--dim); font-weight: 700; font-size: 12px; text-transform: uppercase;
       border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; }
  tr.hotrow td { color: var(--red); }
  tr.warmrow td { color: var(--orange); }
  th[data-key] { cursor: pointer; }
  th[data-key]:hover { color: var(--bright); }
  tbody tr:hover td { background: #161b22; }
  .gpu { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; margin: 4px 0; }
  .gpu.nvidia { border-color: var(--green); }
  .gpu.intel { border-color: var(--cyan); }
  .gpu.amd { border-color: var(--red); }
  .gpu .nm { color: var(--bright); }
  .gpu .id { color: var(--dim); font-size: 12px; }
  .gphead { color: var(--dim); font-size: 11px; text-transform: uppercase;
            letter-spacing: .08em; margin: 6px 0 2px; }
  .gphead:first-child { margin-top: 0; }
  .spark { height: 24px; margin: 2px 0 6px; }
  .none { color: var(--dim); }
</style>
</head>
<body>
<header class="top">
  <div class="logo">glances-rs</div>
  <div class="host" id="host">—</div>
  <div class="sub" id="os">—</div>
  <div class="right">
    <span>UPTIME <b id="uptime">—</b></span>
    <span>LOAD <b id="load">—</b></span>
    <span id="state">connecting…</span>
  </div>
</header>
<main>
  <div>
    <section><h2>CPU <span id="cpu-total-h"></span></h2>
      <div class="bar" id="cpu-bar"><div style="width:0%"></div></div>
      <div class="spark" id="spark-cpu"></div>
      <div class="row"><span class="k">user / system / iowait / steal</span><span class="v" id="cpu-split">—</span></div>
      <div class="row"><span class="k">cores</span><span class="v" id="cpu-cores">—</span></div>
      <div id="percpu"></div>
    </section>
    <section><h2>Memory</h2>
      <div class="bar" id="mem-bar"><div style="width:0%"></div></div>
      <div class="spark" id="spark-mem"></div>
      <div class="row"><span class="k">used / total</span><span class="v" id="mem-use">—</span></div>
      <div class="row"><span class="k">swap</span><span class="v" id="swap">—</span></div>
      <div class="row"><span class="k">tasks run / total / threads</span><span class="v" id="procs">—</span></div>
    </section>
    <section><h2>GPUs</h2><div id="gpus"><span class="none">—</span></div></section>
  </div>
  <div>
    <section><h2>Network</h2><div id="net"><span class="none">—</span></div></section>
    <section><h2>Disk I/O</h2><div id="diskio"><span class="none">—</span></div></section>
    <section><h2>Filesystems</h2><div id="fs"><span class="none">—</span></div></section>
    <section><h2>Sensors</h2><div id="sensors"><span class="none">—</span></div></section>
    <section><h2>Alerts</h2><div id="alerts"><span class="none">no alerts</span></div></section>
  </div>
  <div>
    <section><h2>Processes</h2>
      <table><thead><tr><th class="num" data-key="pid">PID</th><th data-key="name">Name</th><th class="num" data-key="cpu">CPU%</th>
      <th class="num" data-key="mem">MEM%</th><th class="num" data-key="rss">RSS</th><th class="num" data-key="thr">THR</th><th data-key="status">ST</th></tr></thead>
      <tbody id="plist"></tbody></table>
    </section>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const num = (v, d = 1) => (typeof v === "number" && isFinite(v)) ? v.toFixed(d) : "—";
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function bytes(v) {
  if (typeof v !== "number" || !isFinite(v)) return "—";
  const u = ["B", "K", "M", "G", "T"];
  let i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(1) + u[i];
}
function dur(sec) {
  if (typeof sec !== "number" || !isFinite(sec)) return "—";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
        m = Math.floor(sec % 3600 / 60);
  return (d ? d + "d " : "") + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}
function level(pct) { return (typeof pct !== "number" || !isFinite(pct)) ? "" : pct >= 90 ? "hot" : pct >= 70 ? "warm" : ""; }
function setBar(id, pct) {
  const b = $(id);
  const p = (typeof pct === "number" && isFinite(pct)) ? Math.min(100, Math.max(0, pct)) : 0;
  b.firstElementChild.style.width = p + "%";
  b.className = "bar" + (level(pct) ? " " + level(pct) : "");
}
function kv(parent, k, v) {
  const r = el("div", "row");
  r.append(el("span", "k", k), el("span", "v", v));
  parent.append(r);
}
function render(d) {
  const cpu = d.cpu || {}, mem = d.mem || {}, load = d.load || {},
        sys = d.system || {}, pc = d.processcount || {}, swap = d.memswap || {};
  lastCpu = cpu.total;
  lastMem = mem.percent;
  $("host").textContent = sys.hostname || "—";
  $("os").textContent = [sys.os_name, sys.os_version, sys.kernel].filter(Boolean).join(" · ");
  $("uptime").textContent = dur(d.uptime && d.uptime.seconds);
  $("load").textContent = num(load.min1, 2) + " " + num(load.min5, 2) + " " + num(load.min15, 2);
  setBar("cpu-bar", cpu.total);
  $("cpu-total-h").textContent = num(cpu.total) + "%";
  $("cpu-split").textContent = num(cpu.user) + " / " + num(cpu.system) + " / " + num(cpu.iowait) + " / " + num(cpu.steal);
  $("cpu-cores").textContent = String(cpu.cpucore ?? load.cpucore ?? "—");
  const cores = $("percpu");
  cores.textContent = "";
  (Array.isArray(d.percpu) ? d.percpu : []).forEach((c) => {
    const m = el("div", "mini");
    const t = (typeof c.total === "number" && isFinite(c.total)) ? Math.min(100, Math.max(0, c.total)) : 0;
    const b = el("div", "bar" + (level(c.total) ? " " + level(c.total) : ""));
    const f = el("div");
    f.style.width = t + "%";
    b.append(f);
    m.append(el("span", "k", String(c.cpu_number ?? "?")), b, el("span", "v", num(c.total) + "%"));
    cores.append(m);
  });
  setBar("mem-bar", mem.percent);
  $("mem-use").textContent = num(mem.percent) + "% · " + bytes(mem.used) + "/" + bytes(mem.total);
  $("swap").textContent = num(swap.percent) + "% · " + bytes(swap.used) + "/" + bytes(swap.total);
  $("procs").textContent = (pc.running ?? "—") + "/" + (pc.total ?? "—") + "/" + (pc.thread ?? "—");
  const sens = $("sensors");
  sens.textContent = "";
  (Array.isArray(d.sensors) ? d.sensors : []).filter((s) => s.kind === "temperature_c").slice(0, 10).forEach((s) => {
    const r = el("div", "row");
    const t = (typeof s.value === "number") ? s.value : NaN;
    const v = el("span", "v" + (t >= 80 ? " hot-t" : t >= 60 ? " warm-t" : ""), num(s.value) + "°C");
    r.append(el("span", "k", String(s.label || s.chip || "?")), v);
    sens.append(r);
  });
  if (!sens.hasChildNodes()) sens.append(el("span", "none", "—"));
  const gp = $("gpus");
  gp.textContent = "";
  let lastKind = "";
  (Array.isArray(d.gpu) ? d.gpu : []).slice().sort((a, b) => {
    const ka = a.kind === "internal" ? 0 : 1, kb = b.kind === "internal" ? 0 : 1;
    return ka - kb || String(a.name || "").localeCompare(String(b.name || ""));
  }).forEach((g) => {
    const kind = g.kind === "internal" ? "Internal" : "External";
    if (kind !== lastKind) { gp.append(el("div", "gphead", kind)); lastKind = kind; }
    const box = el("div", "gpu " + String(g.vendor || "").toLowerCase());
    box.append(el("div", "nm", String(g.name || "?") + " · " + num(g.util_pct) + "%" + (g.freq_mhz ? " · " + num(g.freq_mhz, 0) + "MHz" : "")));
    box.append(el("div", "id", String(g.vendor || "?") + " " + String(g.pci || g.gpu_id || "")));
    if (typeof g.mem_used_mb === "number" || typeof g.temp_c === "number") {
      const parts = [];
      if (typeof g.mem_used_mb === "number" && typeof g.mem_total_mb === "number")
        parts.push("MEM " + num(g.mem_used_mb, 0) + "/" + num(g.mem_total_mb, 0) + " MB");
      if (typeof g.temp_c === "number") parts.push(num(g.temp_c, 0) + "°C");
      if (parts.length) box.append(el("div", "id", parts.join(" · ")));
    }
    gp.append(box);
  });
  if (!gp.hasChildNodes()) gp.append(el("span", "none", "—"));
  const net = $("net");
  net.textContent = "";
  (Array.isArray(d.network) ? d.network : []).forEach((n) => {
    if (n.is_up === false) return;
    kv(net, String(n.interface_name || "?"),
      "Rx " + bytes(n.bytes_recv_rate_per_sec) + "/s Tx " + bytes(n.bytes_sent_rate_per_sec) + "/s");
  });
  if (!net.hasChildNodes()) net.append(el("span", "none", "—"));
  const dio = $("diskio");
  dio.textContent = "";
  (Array.isArray(d.diskio) ? d.diskio : []).forEach((x) => {
    kv(dio, String(x.disk_name || "?"),
      "R " + bytes(x.read_bytes_rate_per_sec) + "/s W " + bytes(x.write_bytes_rate_per_sec) + "/s");
  });
  if (!dio.hasChildNodes()) dio.append(el("span", "none", "—"));
  const fs = $("fs");
  fs.textContent = "";
  (Array.isArray(d.fs) ? d.fs : []).forEach((f) => {
    const m = el("div", "mini");
    const t = (typeof f.percent === "number" && isFinite(f.percent)) ? Math.min(100, Math.max(0, f.percent)) : 0;
    const b = el("div", "bar" + (level(f.percent) ? " " + level(f.percent) : ""));
    const fl = el("div");
    fl.style.width = t + "%";
    b.append(fl);
    m.append(el("span", "k", String(f.mnt_point || "?")), b, el("span", "v", num(f.percent) + "%"));
    m.firstElementChild.style.width = "64px";
    fs.append(m);
  });
  if (!fs.hasChildNodes()) fs.append(el("span", "none", "—"));
  const al = $("alerts");
  al.textContent = "";
  (Array.isArray(d.alert) ? d.alert : []).slice(0, 10).forEach((a) => {
    kv(al, String(a.type || "?") + "/" + String(a.stat || "?"), num(a.value, 2));
  });
  if (!al.hasChildNodes()) al.append(el("span", "none", "no alerts"));
  lastProcs = Array.isArray(d.processlist) ? d.processlist : [];
  renderProcs();
}
let lastProcs = [];
let sortKey = "cpu", sortDir = -1;
function procVal(p, key) {
  switch (key) {
    case "pid": return p.pid || 0;
    case "name": return String(p.name || "");
    case "mem": return p.memory_percent || 0;
    case "rss": return (p.memory_info && p.memory_info.rss) || 0;
    case "thr": return p.num_threads || 0;
    case "status": return String(p.status || "");
    default: return p.cpu_percent || 0;
  }
}
function renderProcs() {
  const tb = $("plist");
  tb.textContent = "";
  lastProcs.slice().sort((a, b) => {
    const x = procVal(a, sortKey), y = procVal(b, sortKey);
    const c = (typeof x === "string") ? x.localeCompare(y) : x - y;
    return c * sortDir || ((b.cpu_percent || 0) - (a.cpu_percent || 0));
  }).slice(0, 30).forEach((p) => {
    const c = p.cpu_percent || 0;
    const tr = el("tr", c >= 90 ? "hotrow" : c >= 70 ? "warmrow" : "");
    const td = (t, cls) => el("td", cls, t);
    tr.append(td(String(p.pid ?? "?"), "num"), td(p.name || "?"),
      td(num(p.cpu_percent), "num"), td(num(p.memory_percent), "num"),
      td(bytes(p.memory_info && p.memory_info.rss), "num"),
      td(String(p.num_threads ?? "?"), "num"), td(p.status || "?"));
    tb.append(tr);
  });
  document.querySelectorAll("th[data-key]").forEach((th) => {
    const base = th.textContent.replace(/ [▲▼]$/, "");
    th.textContent = base + (th.getAttribute("data-key") === sortKey ? (sortDir === -1 ? " ▼" : " ▲") : "");
  });
}
document.querySelectorAll("th[data-key]").forEach((th) => {
  th.addEventListener("click", () => {
    const k = th.getAttribute("data-key");
    if (k === sortKey) { sortDir = -sortDir; }
    else { sortKey = k; sortDir = (k === "name" || k === "status") ? 1 : -1; }
    renderProcs();
  });
});
const HIST_N = 60;
const series = { cpu: [], mem: [] };
let lastCpu = NaN, lastMem = NaN;
function pushPoint(arr, v) {
  if (typeof v !== "number" || !isFinite(v)) return;
  arr.push(v);
  if (arr.length > HIST_N) arr.shift();
}
function histPoints(node) {
  if (!Array.isArray(node)) return [];
  return node.slice(-HIST_N).map((p) => (Array.isArray(p) && typeof p[1] === "number" && isFinite(p[1]) ? p[1] : NaN));
}
async function seedHistory() {
  // Slim backfill: per-plugin last-60 instead of the multi-MB global
  // dump. Merges in front of any live points, then redraws sparks.
  try {
    const [c, m] = await Promise.all([
      fetch("api/4/cpu/history/60", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)),
      fetch("api/4/mem/history/60", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)),
    ]);
    if (c) {
      const u = histPoints(c.user), s = histPoints(c.system);
      const n = Math.min(u.length, s.length);
      const back = [];
      for (let i = 0; i < n; i++) {
        const a = u[u.length - n + i], b = s[s.length - n + i];
        if (isFinite(a) && isFinite(b)) back.push(a + b);
      }
      series.cpu = back.concat(series.cpu).slice(-HIST_N);
    }
    if (m) {
      const back = histPoints(m.percent).filter((v) => isFinite(v));
      series.mem = back.concat(series.mem).slice(-HIST_N);
    }
    drawSpark("spark-cpu", series.cpu, 100);
    drawSpark("spark-mem", series.mem, 100);
  } catch (e) { /* live-only mode */ }
}
const SVGNS = "http://www.w3.org/2000/svg";
function drawSpark(id, arr, max) {
  const box = $(id);
  box.textContent = "";
  if (arr.length < 2) return;
  const W = 132, H = 24;
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("width", String(W));
  svg.setAttribute("height", String(H));
  const peak = Math.max(max, 1, ...arr);
  const pts = arr.map((v, i) => (i / (arr.length - 1) * W).toFixed(1) + "," + (H - 1 - Math.min(1, v / peak) * (H - 2)).toFixed(1)).join(" ");
  const pl = document.createElementNS(SVGNS, "polyline");
  pl.setAttribute("points", pts);
  pl.setAttribute("fill", "none");
  pl.setAttribute("stroke", level(arr[arr.length - 1]) === "hot" ? "#f85149" : level(arr[arr.length - 1]) === "warm" ? "#d29922" : "#3fb950");
  pl.setAttribute("stroke-width", "1.5");
  svg.append(pl);
  box.append(svg);
}
async function tick() {
  try {
    const r = await fetch("api/all/values", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
    fullLanded = true;
    pushPoint(series.cpu, lastCpu);
    pushPoint(series.mem, lastMem);
    drawSpark("spark-cpu", series.cpu, 100);
    drawSpark("spark-mem", series.mem, 100);
    $("state").textContent = "live " + new Date().toLocaleTimeString();
  } catch (e) {
    $("state").textContent = "retry (" + e.message + ")";
  }
}
let fullLanded = false;
async function quickPaint() {
  // First numbers in ~1 RTT: tiny parallel fetches merged into a
  // partial payload (render() tolerates missing sections). Skipped
  // if the full payload already landed.
  const keys = ["cpu", "mem", "load", "system", "uptime", "memswap", "processcount"];
  const parts = await Promise.all(keys.map((p) =>
    fetch("api/4/" + p, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null)
  ));
  if (fullLanded) return;
  const d = {};
  keys.forEach((k, i) => { d[k] = parts[i] || {}; });
  render(d);
}
quickPaint();
tick();
setInterval(tick, 2000);
seedHistory();
</script>
</body>
</html>
