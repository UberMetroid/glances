name: aegis
on:
  push:
    branches: [ rust ]
  pull_request:
    branches: [ rust ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  aegis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: studio2201/studio2201@v1
        with:
          tools: aegis
          fail-on: block
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-report
          path: aegis_report.md
          if-no-files-found: ignore