[package]
name = "glances-rs"
version = "0.10.55"
edition = "2024"
rust-version = "1.98.1"
description = "Pure-standard-library Rust port of Glances (Linux system monitor). No crates.io dependencies. Linux-only."
license = "LGPL-3.0-only"

# AC-1: NO [dependencies] section allowed. Only std, core, alloc, and direct
# extern "C" to libc / Win32 / Mach. Lint script qa/lint/no_crates.rs enforces this.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "glances-rs"
path = "src/main.rs"

[lib]
name = "glances_rs"
path = "src/lib.rs"

# Build script runs the lint suite; build fails if any lint fails.
# This guarantees AC-1, AC-2, AC-11 are checked at every cargo build.
[features]
default = []
